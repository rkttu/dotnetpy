name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Analyzer Tests
        run: dotnet test src/DotNetPy.Analyzers.Tests/DotNetPy.Analyzers.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run Unit Tests
        run: dotnet test src/DotNetPy.UnitTest/DotNetPy.UnitTest.csproj --no-build --configuration Release --verbosity normal
        continue-on-error: true  # Some tests may require specific Python setup

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Pack DotNetPy
        run: dotnet pack src/DotNetPy/DotNetPy.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack DotNetPy.Analyzers
        run: dotnet pack src/DotNetPy.Analyzers/DotNetPy.Analyzers.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7
